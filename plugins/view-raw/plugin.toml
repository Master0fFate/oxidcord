id = "dev.oxidcord.view-raw"
name = "View Raw"
version = "0.1.0"
api = "^1.2"
authors = ["fate"]
license = "MIT OR Apache-2.0"
description = "Shows the client data of a message, member or channel as JSON with copy buttons."
entry = "view_raw.wasm"
min_host = "0.4.3"

[[permissions]]
permission = "ui-mount"
reason = "Adds the View raw button and menu entries and opens the data window."

[[permissions]]
permission = "context-timeline"
reason = "Reads the message you ask for."

[[permissions]]
permission = "context-roles"
reason = "Reads the member data of the person you ask for."

[[permissions]]
permission = "context-directory"
reason = "Reads the channel data of the channel you ask for."

[[permissions]]
permission = "actions-clipboard"
reason = "Copies the data and the message text."

[[permissions]]
permission = "storage"
reason = "Reads the plugin settings."
