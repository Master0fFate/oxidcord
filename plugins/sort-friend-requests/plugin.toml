id = "dev.oxidcord.sort-friend-requests"
name = "Sort Friend Requests"
version = "0.1.1"
api = "^1.2"
authors = ["fate"]
license = "MIT OR Apache-2.0"
description = "Requests by date tab on the Friends page with incoming and outgoing requests, newest first."
entry = "sort_friend_requests.wasm"
min_host = "0.4.3"

[[permissions]]
permission = "ui-mount"
reason = "Adds the Requests by date tab to the Friends page."

[[permissions]]
permission = "context-relationships"
reason = "Reads your pending friend requests and when they arrived."

[[permissions]]
permission = "storage"
reason = "Reads the plugin settings."
