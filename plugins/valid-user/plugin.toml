id = "dev.oxidcord.valid-user"
name = "Valid User"
version = "0.1.0"
api = "^1.2"
authors = ["fate"]
license = "MIT OR Apache-2.0"
description = "Fix mentions for unknown users showing up as '@unknown-user'"
entry = "valid_user.wasm"
min_host = "0.4.3"

[[permissions]]
permission = "message-intercept"
reason = "Finds mentions of users the client does not know."

[[permissions]]
permission = "context-members"
reason = "Loads the unknown users so their mentions show a name."
