id = "dev.oxidcord.message-click-actions"
name = "Message Click Actions"
version = "0.1.0"
api = "^1.2"
authors = ["fate"]
license = "MIT OR Apache-2.0"
description = "Double click to edit/reply, Ctrl+Alt click to delete"
entry = "message_click_actions.wasm"
min_host = "0.4.3"
hooks = ["message-click"]

[[permissions]]
permission = "ui-input"
reason = "Listens for double clicks and Ctrl+Alt clicks on messages."

[[permissions]]
permission = "context-timeline"
reason = "Finds out whether the clicked message is yours."

[[permissions]]
permission = "actions-compose"
reason = "Starts the edit or reply in the composer."

[[permissions]]
permission = "actions-delete"
reason = "Deletes your message when you Ctrl+Alt click it."

[[permissions]]
permission = "storage"
reason = "Reads the plugin settings."
