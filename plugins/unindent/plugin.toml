id = "dev.oxidcord.unindent"
name = "Unindent"
version = "0.1.0"
api = "^1.0"
authors = ["fate"]
license = "MIT OR Apache-2.0"
description = "Trims leading indentation from codeblocks."
entry = "unindent.wasm"
min_host = "0.1.0"

[[permissions]]
permission = "message-send"
reason = "Removes the shared indentation from code blocks in a message you are about to send."

[[permissions]]
permission = "message-render"
reason = "Removes the shared indentation from code blocks in messages you read."
