id = "dev.oxidcord.image-filename"
name = "Image Filename"
version = "0.1.1"
api = "^1.2"
authors = ["fate"]
license = "MIT OR Apache-2.0"
description = "Shows the file name of image attachments as a tooltip."
entry = "image_filename.wasm"
min_host = "0.4.3"
hooks = ["intercept"]

[[permissions]]
permission = "message-intercept"
reason = "Adds the file name tooltip to image attachments."

[[permissions]]
permission = "storage"
reason = "Reads the plugin settings."
