id = "dev.oxidcord.who-reacted"
name = "Who Reacted"
version = "0.1.0"
api = "^1.2"
authors = ["fate"]
license = "MIT OR Apache-2.0"
description = "Renders the avatars of users who reacted to a message"
entry = "who_reacted.wasm"
min_host = "0.4.3"

[[permissions]]
permission = "ui-mount"
reason = "Adds the Reactors button to the message toolbar."

[[permissions]]
permission = "context-timeline"
reason = "Reads the reactions of a message and loads who reacted."

[[permissions]]
permission = "message-intercept"
reason = "Shows the reacting users under the message."

[[permissions]]
permission = "storage"
reason = "Reads the plugin settings."
