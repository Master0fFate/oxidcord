id = "dev.oxidcord.reveal-all-spoilers"
name = "Reveal All Spoilers"
version = "0.1.1"
api = "^1.2"
authors = ["fate"]
license = "MIT OR Apache-2.0"
description = "Reveal all spoilers in a message by Ctrl-clicking a spoiler, or in the chat with Ctrl+Shift-click"
entry = "reveal_all_spoilers.wasm"
min_host = "0.4.3"
hooks = ["intercept", "message-click"]

[[permissions]]
permission = "ui-input"
reason = "Listens for Ctrl clicks on spoilers."

[[permissions]]
permission = "message-intercept"
reason = "Shows the spoilers of the messages you revealed."

[[permissions]]
permission = "context-timeline"
reason = "Finds the messages with spoilers in the open channel."
