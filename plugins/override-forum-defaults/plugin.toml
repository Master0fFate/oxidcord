id = "dev.oxidcord.override-forum-defaults"
name = "Override Forum Defaults"
version = "0.1.0"
api = "^1.2"
authors = ["fate"]
license = "MIT OR Apache-2.0"
description = "Allows you to override default forum layout/sort order. you can still change it on a per-channel basis."
entry = "override_forum_defaults.wasm"
min_host = "0.4.3"

[[permissions]]
permission = "actions-settings"
reason = "Sets the layout and sort order forums open with."

[[permissions]]
permission = "storage"
reason = "Reads the plugin settings."
