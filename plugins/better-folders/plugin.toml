id = "dev.oxidcord.better-folders"
name = "Better Folders"
version = "0.1.0"
api = "^1.2"
authors = ["fate"]
license = "MIT OR Apache-2.0"
description = "Shows server folders on dedicated sidebar and adds folder related improvements."
entry = "better_folders.wasm"
min_host = "0.4.3"

[[permissions]]
permission = "actions-settings"
reason = "Turns the folder sidebar and the plain folder icons on and off."

[[permissions]]
permission = "storage"
reason = "Reads the plugin settings."
