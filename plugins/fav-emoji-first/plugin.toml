id = "dev.oxidcord.fav-emoji-first"
name = "Favorite Emoji First"
version = "0.1.1"
api = "^1.2"
authors = ["fate"]
license = "MIT OR Apache-2.0"
description = "Puts the emoji you sent most recently first in the emoji autocomplete."
entry = "fav_emoji_first.wasm"
min_host = "0.4.3"
hooks = ["autocomplete-emoji", "before-send"]

[[permissions]]
permission = "ui-input"
reason = "Reorders the emoji suggestions while you type a :shortcode."

[[permissions]]
permission = "context-expressions"
reason = "Reads your favorite emoji."

[[permissions]]
permission = "message-send"
reason = "Notes which emoji you use in the messages you send."

[[permissions]]
permission = "storage"
reason = "Keeps the list of emoji you used lately."
