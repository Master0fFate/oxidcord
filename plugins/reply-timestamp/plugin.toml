id = "dev.oxidcord.reply-timestamp"
name = "Reply Timestamp"
version = "0.1.0"
api = "^1.2"
authors = ["fate"]
license = "MIT OR Apache-2.0"
description = "Shows a timestamp on replied-message previews"
entry = "reply_timestamp.wasm"
min_host = "0.4.3"
hooks = ["intercept"]

[[permissions]]
permission = "message-intercept"
reason = "Adds the time of the replied message to the reply quote."

[[permissions]]
permission = "storage"
reason = "Reads the plugin settings."
