id = "dev.oxidcord.message-latency"
name = "Message Latency"
version = "0.1.0"
api = "^1.2"
authors = ["fate"]
license = "MIT OR Apache-2.0"
description = "Shows how long your own messages took to send when it was slow."
entry = "message_latency.wasm"
min_host = "0.4.3"
hooks = ["intercept"]

[[permissions]]
permission = "message-intercept"
reason = "Adds the delay line to slow messages."

[[permissions]]
permission = "storage"
reason = "Reads the plugin settings."
