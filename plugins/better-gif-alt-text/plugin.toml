id = "dev.oxidcord.better-gif-alt-text"
name = "Better GIF Alt Text"
version = "0.1.0"
api = "^1.2"
authors = ["fate"]
license = "MIT OR Apache-2.0"
description = "Change GIF alt text from simply being 'GIF' to containing the gif tags / filename"
entry = "better_gif_alt_text.wasm"
min_host = "0.4.3"
hooks = ["intercept"]
image_hosts = ["media.tenor.com", "c.tenor.com", "media1.tenor.com", "media.giphy.com", "i.imgur.com"]

[[permissions]]
permission = "message-intercept"
reason = "Sets the alt text of GIF attachments and GIF embeds."
