id = "dev.oxidcord.implicit-relationships"
name = "Implicit Relationships"
version = "0.1.0"
api = "^1.2"
authors = ["fate"]
license = "MIT OR Apache-2.0"
description = "Shows your implicit relationships in the Friends tab."
