id = "dev.oxidcord.web-keybinds"
name = "Web Keybinds"
version = "0.1.0"
api = "^1.2"
authors = ["fate"]
license = "MIT OR Apache-2.0"
description = "Re-adds keybinds missing in the web version of Discord."
entry = "web_keybinds.wasm"
min_host = "0.4.3"

[[permissions]]
permission = "ui-keybinds"
reason = "Listens for Ctrl+comma, Alt+Left and Alt+Right."

[[permissions]]
permission = "actions-navigate"
reason = "Opens the settings and goes back and forward."

[[permissions]]
permission = "ui-mount"
reason = "Shows the back and forward buttons in the title bar."

[[permissions]]
permission = "storage"
reason = "Reads the plugin settings."
