id = "dev.oxidcord.voice-download"
name = "Voice Download"
version = "0.1.1"
api = "^1.2"
authors = ["fate"]
license = "MIT OR Apache-2.0"
description = "Adds a download button to voice messages and other audio attachments."
entry = "voice_download.wasm"
min_host = "0.4.3"

[[permissions]]
permission = "ui-mount"
reason = "Adds the download button next to audio attachments."

[[permissions]]
permission = "context-timeline"
reason = "Reads the content type of the attachment to show the button on audio only."

[[permissions]]
permission = "actions-save"
reason = "Saves the audio file you click download on."
