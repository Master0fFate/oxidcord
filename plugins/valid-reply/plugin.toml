id = "dev.oxidcord.valid-reply"
name = "Valid Reply"
version = "0.1.0"
api = "^1.2"
authors = ["fate"]
license = "MIT OR Apache-2.0"
description = "Fixes \"Message could not be loaded\" upon hovering over the reply"
entry = "valid_reply.wasm"
min_host = "0.4.3"

[[permissions]]
permission = "message-intercept"
reason = "Shows the replied message under replies the client could not resolve."

[[permissions]]
permission = "context-timeline"
reason = "Loads the replied message when the client does not have it."

[[permissions]]
permission = "actions-compose"
reason = "Scrolls to the replied message from the Jump button."
