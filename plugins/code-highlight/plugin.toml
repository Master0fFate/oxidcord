id = "dev.oxidcord.code-highlight"
name = "Code Highlight"
version = "0.1.0"
api = "^1.2"
authors = ["fate"]
license = "MIT OR Apache-2.0"
description = "Syntax highlighting for code blocks in 16 languages."
entry = "code_highlight.wasm"
min_host = "0.4.3"
hooks = ["intercept"]

[[permissions]]
permission = "message-intercept"
reason = "Colors the code blocks of messages."

[[permissions]]
permission = "storage"
reason = "Reads the plugin settings."
