id = "dev.oxidcord.new-guild-settings"
name = "New Guild Settings"
version = "0.1.1"
api = "^1.2"
authors = ["fate"]
license = "MIT OR Apache-2.0"
description = "Applies your notification settings to servers when you join them."
entry = "new_guild_settings.wasm"
min_host = "0.4.3"

[[permissions]]
permission = "context-directory"
reason = "Sees when you join a server."

[[permissions]]
permission = "actions-settings"
reason = "Applies the notification settings to the server you joined."

[[permissions]]
permission = "storage"
reason = "Reads the plugin settings."
