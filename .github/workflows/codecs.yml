name: Codec pack

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            name: windows-x64
          - runner: ubuntu-22.04
            name: linux-x64
          - runner: macos-latest
            name: macos-aarch64
          - runner: macos-15-intel
            name: macos-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build pack
        shell: bash
        env:
          OUT: ${{ runner.temp }}/codecs
        run: |
          case "${{ matrix.name }}" in
            macos-*) brew install nasm yasm; bash packaging/codecs/build-macos.sh ;;
            *) cargo xtask codecs --out "$OUT" ;;
          esac
          ls -l "$OUT"
      - name: Check the pack decodes
        shell: bash
        run: cargo xtask headless-run --mock
      - uses: actions/upload-artifact@v4
        with:
          name: codecs-${{ matrix.name }}
          path: ${{ runner.temp }}/codecs/*
          if-no-files-found: error